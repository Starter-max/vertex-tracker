<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Corp</title>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;color:#1a1a1a;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.layout{display:flex;flex:1;overflow:hidden}
.main{flex:1;overflow-y:auto;padding:1.25rem 1.25rem 2rem}
.sidebar{width:340px;min-width:340px;background:#fff;border-left:1px solid #e0e0e0;display:flex;flex-direction:column;transition:width 0.2s}
.sidebar.closed{width:0;min-width:0;overflow:hidden}
header{background:#fff;border-bottom:1px solid #e0e0e0;padding:0.75rem 1.25rem;display:flex;align-items:center;gap:12px;flex-shrink:0}
.logo{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.nav{display:flex;gap:4px;margin-left:16px}
.nav-btn{font-size:12px;padding:5px 12px;border:1px solid transparent;border-radius:7px;background:transparent;cursor:pointer;color:#666}
.nav-btn:hover,.nav-btn.active{background:#f5f5f5;color:#1a1a1a;border-color:#e0e0e0}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.time-badge{font-size:11px;padding:3px 9px;border-radius:20px;background:#f5f5f5;color:#888}
.time-badge.stale{background:#e74c3c;color:#fff}
.btn{font-size:12px;padding:5px 12px;border:1px solid #ddd;border-radius:7px;background:#fff;cursor:pointer;color:#555}
.btn:hover{background:#f5f5f5}
.btn.primary{border-color:#3498db;color:#3498db}
.btn.danger{border-color:#e74c3c;color:#e74c3c}
.btn.success{border-color:#27ae60;color:#27ae60}
.btn.chat-toggle{background:#1a1a1a;color:#fff;border-color:#1a1a1a;font-size:13px;padding:6px 14px}
.alert{background:#fff5f5;border:1px solid #fcc;border-radius:10px;padding:0.65rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:10px;font-size:13px;color:#c0392b}
.sys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
.sys-card{background:#fff;border-radius:10px;border:1px solid #e8e8e8;padding:0.7rem 1rem}
.lbl{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.val{font-size:20px;font-weight:700;color:#1a1a1a}
.sub{font-size:11px;color:#bbb;margin-top:2px}
.bar{height:3px;background:#eee;border-radius:2px;margin-top:7px}
.bf{height:3px;border-radius:2px;background:#27ae60;transition:width .5s}
.bf.w{background:#e67e22}.bf.d{background:#e74c3c}
.section{margin-bottom:1.25rem}
.ga-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ga-card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:1rem;box-shadow:0 1px 8px rgba(0,0,0,.03)}.ga-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}.ga-avatar{width:38px;height:38px;border-radius:12px;background:#f0f6ff;display:flex;align-items:center;justify-content:center;font-size:20px}.ga-title{font-weight:700}.ga-role{font-size:11px;color:#888;line-height:1.35}.ga-line{font-size:12px;color:#555;margin-top:6px;line-height:1.45}.ga-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.status-active{background:#eafaf1;color:#27ae60}.status-thinking{background:#eef6ff;color:#2475aa}.status-waiting{background:#fff4ec;color:#e67e22}.status-idle{background:#f5f5f5;color:#999}.status-error{background:#fdf0f0;color:#e74c3c}.status-paused{background:#f3efff;color:#7d5bd1}.agent-page-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.timeline-item{padding:.55rem .75rem;border-left:2px solid #ddd;background:#fafafa;margin-bottom:6px;border-radius:0 8px 8px 0}.chat-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:.9rem;margin-bottom:8px}.chat-line{font-size:12px;line-height:1.5;margin:6px 0;padding:7px 9px;border-radius:8px;background:#f8f8f8}.chat-line.agent{background:#eef6ff}.chat-line.owner{background:#f5f5f5}.chat-line.system{background:#fff4ec}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#aaa}
.sec-count{font-size:11px;color:#ccc}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1rem 1.1rem;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#ccc;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.card.err{border-left:3px solid #e74c3c}
.card.dim{opacity:.5}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.card-name{font-size:13px;font-weight:600;line-height:1.3}
.card-meta{font-size:11px;color:#bbb;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.dg{background:#27ae60}.dp{background:#bbb}.dr{background:#e74c3c}.dn{background:#ddd}
.cost-row{display:flex;justify-content:space-between;margin-bottom:5px}
.cv{font-size:12px;color:#666}.cl{font-size:11px;color:#bbb}
.act-row{font-size:11px;color:#bbb;margin-bottom:6px}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
.b-ok{background:#eafaf1;color:#27ae60}.b-err{background:#fdf0f0;color:#e74c3c}
.b-pause{background:#f5f5f5;color:#999}.b-new{background:#f5f5f5;color:#bbb}
.actions{display:flex;gap:6px}
.detail-wrap{background:#fff;border-radius:14px;border:1px solid #e8e8e8;padding:1.25rem}
.detail-hdr{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.metrics3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem}
.met{background:#f9f9f9;border-radius:8px;padding:.7rem .9rem}
.met .lbl{font-size:10px}.met .val{font-size:18px;font-weight:700}
.tbl{border:1px solid #eee;border-radius:8px;overflow:hidden;margin-bottom:1.25rem}
.tbl-row{display:flex;align-items:center;justify-content:space-between;padding:.55rem .9rem;border-bottom:1px solid #f0f0f0;font-size:13px}
.tbl-row:last-child{border-bottom:none}
.logbox{background:#f8f8f8;border-radius:8px;padding:.75rem;font-size:11px;font-family:'SF Mono',Monaco,monospace;color:#555;line-height:1.7;max-height:150px;overflow-y:auto;white-space:pre-wrap;margin-bottom:1.25rem}
.workroom-box{background:#0f172a;color:#dbeafe;border-radius:10px;padding:.85rem;font-size:11px;font-family:'SF Mono',Monaco,monospace;line-height:1.55;max-height:260px;overflow-y:auto;white-space:pre-wrap;margin-bottom:1rem;border:1px solid #1e3a8a}
.workroom-tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.workroom-tab{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid #ddd;background:#fff;color:#777;cursor:pointer}
.workroom-tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.settings-wrap{display:grid;gap:1rem}
.settings-group{background:#fff;border-radius:12px;border:1px solid #e8e8e8;overflow:hidden}
.sg-hdr{padding:.75rem 1rem;background:#f9f9f9;border-bottom:1px solid #eee;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#888}
.sg-row{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1rem;border-bottom:1px solid #f5f5f5;font-size:13px}
.sg-row:last-child{border-bottom:none}
.sg-label{color:#555}
.sg-val{color:#888;font-family:'SF Mono',Monaco,monospace;font-size:12px}
.sg-input{font-size:13px;padding:4px 8px;border:1px solid #ddd;border-radius:6px;width:220px;font-family:'SF Mono',Monaco,monospace}
.sg-textarea{font-size:12px;padding:8px;border:1px solid #ddd;border-radius:8px;width:min(560px,60vw);min-height:92px;line-height:1.45;font-family:'SF Mono',Monaco,monospace;white-space:pre-wrap}
.sg-desc{font-size:11px;color:#aaa;text-transform:none;letter-spacing:0;font-weight:400;margin-top:3px;line-height:1.45}
.sg-key{display:block;font-size:10px;color:#bbb;font-family:'SF Mono',Monaco,monospace;margin-top:2px}
.settings-note{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:.8rem 1rem;color:#777;font-size:12px;line-height:1.55}
.chat-sidebar{width:340px;min-width:340px;display:flex;flex-direction:column;height:100%;background:#fff;border-left:1px solid #e0e0e0}
.chat-sidebar.closed{width:0;min-width:0;overflow:hidden}
.chat-tabs{display:flex;align-items:center;gap:0;border-bottom:1px solid #eee;overflow-x:auto;flex-shrink:0}
.chat-tab{font-size:12px;padding:8px 12px;cursor:pointer;white-space:nowrap;color:#888;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.chat-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.chat-tab-x{font-size:10px;color:#ccc;padding:0 2px;line-height:1}
.chat-tab-x:hover{color:#e74c3c}
.chat-add{font-size:16px;padding:8px 12px;cursor:pointer;color:#bbb;border:none;background:none}
.chat-add:hover{color:#1a1a1a}
.chat-messages{flex:1;overflow-y:auto;padding:.75rem}
.chat-empty{text-align:center;color:#ccc;padding:2rem 1rem;font-size:13px}
.msg{margin-bottom:10px;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.msg.assistant{align-items:flex-start}
.msg-bubble{max-width:90%;padding:.55rem .8rem;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.user .msg-bubble{background:#1a1a1a;color:#fff;border-bottom-right-radius:3px}
.msg.assistant .msg-bubble{background:#f5f5f5;color:#1a1a1a;border-bottom-left-radius:3px}
.msg-time{font-size:10px;color:#ccc;margin-top:3px;padding:0 4px}
.chat-input-area{padding:.75rem;border-top:1px solid #eee;flex-shrink:0}
.chat-input-row{display:flex;gap:6px;align-items:flex-end}
.chat-textarea{flex:1;font-size:13px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;resize:none;font-family:inherit;line-height:1.4;max-height:100px;overflow-y:auto}
.chat-textarea:focus{outline:none;border-color:#aaa}
.chat-send{padding:8px 14px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;flex-shrink:0}
.chat-send:hover{background:#333}
.chat-send:disabled{background:#ccc}
.chat-file-btn{padding:7px 10px;background:#f5f5f5;border:1px solid #ddd;border-radius:8px;cursor:pointer;font-size:14px;color:#888}
.chat-file-btn:hover{background:#ebebeb}
.typing{display:flex;align-items:center;gap:4px;padding:8px 12px;background:#f5f5f5;border-radius:12px;width:fit-content;margin-bottom:10px}
.typing span{width:6px;height:6px;background:#bbb;border-radius:50%;animation:bounce .8s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

.agent-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.adot{width:6px;height:6px;border-radius:50%}
.adot-ok{background:#27ae60}.adot-idle{background:#bbb}.adot-err{background:#e74c3c}
.agent-count{font-size:11px;color:#888;margin-top:4px}
.board-msg{padding:6px 8px;border-radius:8px;margin-bottom:6px;font-size:12px;line-height:1.5}
.board-msg.tasks{background:#eef6ff;border-left:2px solid #3498db}
.board-msg.results{background:#eafaf1;border-left:2px solid #27ae60}
.board-msg.alerts{background:#fff5f5;border-left:2px solid #e74c3c}
.board-msg.costs{background:#fef9ec;border-left:2px solid #e67e22}
.board-msg.health{background:#f5f5f5;border-left:2px solid #bbb}
.board-agent{font-weight:700;color:#555;font-size:11px}
.board-time{color:#bbb;font-size:10px;float:right}
.board-content{color:#333;margin-top:2px;font-family:'SF Mono',Monaco,monospace;font-size:11px;word-break:break-all}
.target-select{font-size:12px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#555;margin-bottom:6px;width:100%}
.link{color:#3498db;cursor:pointer;text-decoration:none}.link:hover{text-decoration:underline}.skill-chip{font-size:11px;padding:2px 7px;border:1px solid #d8ecff;background:#eef6ff;color:#2475aa;border-radius:999px;cursor:pointer;margin-right:4px;display:inline-block;margin-top:4px}.skill-chip.matched{border-color:#d7f3df;background:#eafaf1;color:#23834b}.skill-chip.missing{border-color:#ffd9b8;background:#fff4ec;color:#c76a13}.skill-detail{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1rem;white-space:pre-wrap;font-family:'SF Mono',Monaco,monospace;font-size:12px;line-height:1.55;max-height:70vh;overflow:auto}
.section-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
.stab{font-size:12px;padding:5px 12px;border:1px solid #ddd;border-radius:999px;background:#fff;color:#777;cursor:pointer}
.stab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.kb-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.kb-layer-btn{font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;cursor:pointer;color:#888}
.kb-layer-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.kb-filter{font-size:12px;padding:5px 10px;border:1px solid #ddd;border-radius:7px;background:#fff;color:#555}
.kb-wrap{display:flex;gap:14px;overflow-x:auto;padding-bottom:1rem;min-height:70vh}
.kb-col{min-width:240px;width:240px;flex-shrink:0;display:flex;flex-direction:column}
.kb-col-hdr{padding:.6rem .75rem;border-radius:10px 10px 0 0;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;border:1px solid #e8e8e8;border-bottom:none;background:#f9f9f9}
.kb-col-hdr .cnt{font-size:11px;background:#e0e0e0;border-radius:10px;padding:1px 7px;color:#666}
.kb-cards{background:#f5f5f5;border:1px solid #e8e8e8;border-radius:0 0 10px 10px;padding:8px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:200px}
.kb-card{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:.7rem .85rem;cursor:pointer;position:relative}
.kb-card.feature{border-left:3px solid #3498db}.kb-card.td{border-left:3px solid #e67e22}.kb-card.bug{border-left:3px solid #e74c3c}
.kb-p{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;display:inline-block;margin-bottom:5px}
.kb-p0{background:#fdf0f0;color:#e74c3c}.kb-p1{background:#fff4ec;color:#e67e22}.kb-p2{background:#f0f8ff;color:#3498db}.kb-p3{background:#f5f5f5;color:#bbb}
.kb-title{font-size:12px;font-weight:600;line-height:1.35;margin-bottom:5px}
.kb-meta{font-size:10px;color:#bbb;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.kb-badge{font-size:10px;padding:1px 6px;border-radius:10px;background:#f0f0f0;color:#888}
.kb-time{font-size:10px;color:#bbb}.kb-time.warn{color:#e67e22}.kb-time.danger{color:#e74c3c}
.agent-heat{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:10px;color:#aaa}.heat-dot{width:7px;height:7px;border-radius:50%;background:#e5e5e5}.heat-dot.on.hot{background:#27ae60}.heat-dot.on.warm{background:#3498db}.heat-dot.on.cool{background:#e67e22}.heat-dot.on.stale{background:#e74c3c}
.kb-add-btn{font-size:12px;padding:5px 14px;border:1px dashed #ccc;border-radius:7px;background:transparent;cursor:pointer;color:#aaa;margin-top:4px}
.kb-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center}
.kb-modal{background:#fff;border-radius:14px;padding:1.5rem;width:480px;max-width:90vw;max-height:85vh;overflow-y:auto}
.kb-modal h3{font-size:16px;font-weight:700;margin-bottom:1rem}
.kb-status-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:1rem}
.kb-card.dragging{opacity:.5;transform:scale(.98)}
.kb-drop-target{outline:2px dashed #bbb;outline-offset:4px}


@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
@media(max-width:700px){.sys{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.chat-sidebar,.sidebar{width:100%;position:fixed;bottom:0;left:0;right:0;height:60vh;z-index:100;border-top:1px solid #e0e0e0;border-left:none}}
</style>
</head>
<body x-data="app()" x-init="init()">

<header>
  <div class="logo">🏛 Цифровая Корпорация</div>
  <nav class="nav">
    <button class="nav-btn" :class="{active:view==='dashboard'}" @click="view='dashboard';detail=null">Обзор</button>
    <button class="nav-btn" :class="{active:view==='settings'}" @click="view='settings';loadSettings()">Настройки</button>
    <button class="nav-btn" :class="{active:view==='knowledge'}" @click="view='knowledge';loadKnowledge();loadSkills()">🧠 Знания/скилы</button>
    <button class="nav-btn" :class="{active:view==='agents'}" @click="view='agents';loadAgents();loadSkills()">🤖 Агенты</button>
    <button class="nav-btn" :class="{active:view==='kanban'}" @click="view='kanban';loadKanban()">📋 Канбан</button>
    <button class="nav-btn" :class="{active:view==='agentChat'}" @click="openAgentChatPage()">🏛 Чат агентов</button>
  </nav>
  <div class="hdr-right">
    <span class="time-badge" :class="{stale:staleMins>10}" x-text="timeAgoLabel"></span>
    <button class="btn" @click="load()" :disabled="loading" x-text="loading?'…':'↻ обновить'"></button>
    <button class="btn chat-toggle" @click="chatOpen=!chatOpen">
      <span x-text="chatOpen ? '✕ чат' : '💬 Hermes'"></span>
    </button>
  </div>
</header>

<div class="layout">
  <div class="main">

    <template x-if="view==='dashboard' && !detail">
      <div>
        <template x-if="alerts.length>0">
          <div class="alert">⚠️ <span x-text="alerts[0]"></span></div>
        </template>

        <div class="section">
          <div class="sec-hdr">
            <span class="sec-title">🏛 Генеральные агенты</span>
            <button class="btn" @click="loadGeneralAgents()">↻ агенты</button>
          </div>
          <div class="ga-grid">
            <template x-for="a in generalAgents" :key="a.id">
              <div class="ga-card">
                <div class="ga-head">
                  <div class="ga-avatar" x-text="agentIcon(a.id)"></div>
                  <div style="flex:1">
                    <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
                      <div><div class="ga-title" x-text="a.name"></div><div class="ga-role" x-text="a.role"></div></div>
                      <span class="badge" :class="agentStatusClass(a.status)" x-text="agentStatusLabel(a.status)"></span>
                    </div>
                    <div class="ga-role" x-text="a.short_description"></div>
                  </div>
                </div>
                <div class="ga-line"><b>Сейчас:</b> <span x-text="a.current_task_title || 'нет активной задачи'"></span></div>
                <div class="ga-line"><b>В работе:</b> <span x-text="workDuration(a)"></span> · <b>активность:</b> <span x-text="relTime(a.last_activity_at)"></span></div>
                <div class="ga-line"><b>Следующее:</b> <span x-text="a.current_task_next_step || a.metadata?.next_step || '—'"></span></div>
                <div class="ga-line"><b>Задача:</b> <span class="link" @click="openKanbanTask(a.current_task_id)" x-text="a.current_task_id || '—'"></span> <span x-text="a.current_task_priority||''"></span></div>
                <div class="ga-actions">
                  <button class="btn primary" @click="openAgent(a.id)">Открыть агента</button>
                  <button class="btn" @click="openAgentDirectChat(a.id)">Написать</button>
                  <button class="btn" :disabled="!a.current_task_id" @click="openKanbanTask(a.current_task_id)">Открыть задачу</button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <div class="sys">
          <div class="sys-card">
            <div class="lbl">CPU</div>
            <div class="val" x-text="sys.cpu+'%'"></div>
            <div class="bar"><div class="bf" :class="sys.cpu>80?'d':sys.cpu>50?'w':''" :style="'width:'+sys.cpu+'%'"></div></div>
          </div>
          <div class="sys-card">
            <div class="lbl">RAM</div>
            <div class="val" x-text="sys.ram_gb+' GB'"></div>
            <div class="sub" x-text="'из '+sys.ram_total+' GB'"></div>

          <span style="font-size:16px;font-weight:700" x-text="'Skill: '+(skillDetail?.name||'')"></span>
        </div>
        <div class="skill-detail" x-text="skillDetail?.content || 'Скил не загружен'"></div>
      </div>
    </template>

    <template x-if="view==='kanban'">
      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:8px;flex-wrap:wrap">
          <div style="font-size:16px;font-weight:700">📋 Канбан корпорации</div>
          <div class="kb-toolbar" style="margin:0">
            <button class="kb-layer-btn" :class="{active:kanbanLayer==='strategic'}" @click="kanbanLayer='strategic';loadKanban()">Стратегический</button>
            <button class="kb-layer-btn" :class="{active:kanbanLayer==='operational'}" @click="kanbanLayer='operational';loadKanban()">Операционный</button>
            <select class="kb-filter" x-model="kanbanFilter" @change="loadKanban()">
              <option value="all">Все типы</option>
              <option value="feature">feature</option>
              <option value="bug">bug</option>
              <option value="tech_debt">tech_debt</option>
              <option value="task">task</option>
            </select>
          </div>
        </div>
        <div class="kb-toolbar">
          <select class="kb-filter" x-model="kanbanProjectFilter" @change="loadKanban()">
            <option value="all">Все проекты</option>
            <template x-for="p in projects" :key="p.id">
              <option :value="p.id" x-text="p.id.toUpperCase() + ' · ' + p.name"></option>
            </template>
          </select>
          <input class="kb-filter" style="min-width:220px" x-model="newCard.title" placeholder="Новая карточка">
          <input class="kb-filter" style="min-width:280px" x-model="newCard.description" placeholder="Описание">
          <button class="btn primary" @click="createCard()">+ создать</button>
        </div>
        <div class="kb-wrap">
          <template x-for="col in kanbanColumns()" :key="col.id">
            <div class="kb-col" @dragover.prevent="kbDragOver(col.id,$event)" @dragleave="kbDragLeave($event)" @drop.prevent="kbDrop(col.id,$event)">
              <div class="kb-col-hdr"><span x-text="col.label"></span><span class="cnt" x-text="colCount(col.id)"></span></div>
              <div class="kb-cards">
                <template x-for="card in cardsForColumn(col.id)" :key="card.id">
                  <div class="kb-card" :class="cardTypeClass(card.card_type)+' '+(draggedCardId===card.id?'dragging':'')" draggable="true" @dragstart="kbDragStart(card.id,$event)" @dragend="kbDragEnd()" @click="openCard(card)">
                    <div class="kb-p" :class="priorityClass(card.priority)" x-text="card.priority"></div>
                    <div class="kb-title" x-text="card.title"></div>
                    <div class="kb-meta">
                      <span x-text="(card.project_id||'—').toUpperCase()"></span>
                      <span x-text="card.card_type"></span>
                      <span class="kb-time" :class="timeClass(card.time_in_stage_hrs)" x-text="card.time_in_stage"></span>
                    </div>
                    <div class="ga-line" x-show="card.effective_assigned_agent_id || card.curator_agent_id">
                      <span class="link" @click.stop="openAgent(card.effective_assigned_agent_id)" x-text="card.effective_assigned_agent_id ? '👤 '+(card.assigned_agent_name||card.effective_assigned_agent_id) : ''"></span>
                      <span x-show="card.assigned_agent_status" class="badge" :class="agentStatusClass(card.assigned_agent_status)" x-text="agentStatusLabel(card.assigned_agent_status)"></span>
                      <span x-show="card.curator_agent_id"> · куратор: </span><span class="link" @click.stop="openAgent(card.curator_agent_id)" x-text="card.curator_agent_name||card.curator_agent_id||''"></span>
                    </div>
                    <div class="agent-heat" x-show="card.effective_assigned_agent_id">
                      <span>активность агента</span>
                      <template x-for="i in [1,2,3]" :key="i"><span class="heat-dot" :class="(i <= (card.agent_activity_heat||0) ? 'on ' : '') + (card.agent_activity_state||'stale')"></span></template>
                      <span x-text="card.agent_activity_state||'unknown'"></span>
                    </div>
                    <div x-show="(card.required_skills||[]).length">
                      <template x-for="sk in card.required_skills||[]" :key="sk"><span class="skill-chip" :class="(card.missing_skills||[]).includes(sk)?'missing':'matched'" @click.stop="openSkill(sk)" x-text="((card.missing_skills||[]).includes(sk)?'⚠ ':'✓ ')+sk"></span></template>
                    </div>
                    <div class="ga-line" x-show="card.agent_discussion_id"><span class="link" @click.stop="openTaskDiscussion(card)">💬 обсуждение задачи</span></div>
                    <div class="ga-line" x-show="card.next_step"><b>Следующее:</b> <span x-text="card.next_step"></span></div>
                    <div class="ga-line" x-show="card.requires_owner_action || card.blocked_reason" style="color:#e67e22" x-text="card.requires_owner_action ? '⚠ нужен ответ владельца' : '⛔ '+card.blocked_reason"></div>
                    <div class="ga-line" x-show="(card.missing_skills||[]).length" style="color:#e67e22" x-text="'Катя: не хватает скилов · '+(card.missing_skills||[]).join(', ')"></div>
                  </div>
                </template>
                <div style="font-size:11px;color:#bbb;text-align:center;padding:10px 0" x-show="cardsForColumn(col.id).length===0">Пусто</div>
              </div>
            </div>
          </template>
        </div>
        <template x-if="kanbanModal">
          <div class="kb-modal-bg" @click.self="kanbanModal=null">
            <div class="kb-modal">
              <h3 x-text="kanbanModal.title"></h3>
              <div style="font-size:12px;color:#666;line-height:1.6" x-text="kanbanModal.description||'—'"></div>
              <div class="chat-card" style="background:#fafafa">
                <div class="ga-line"><b>Исполнитель:</b> <span class="link" @click="openAgent(kanbanModal.effective_assigned_agent_id)" x-text="kanbanModal.assigned_agent_name||kanbanModal.effective_assigned_agent_id||'—'"></span> <span class="badge" :class="agentStatusClass(kanbanModal.assigned_agent_status)" x-text="agentStatusLabel(kanbanModal.assigned_agent_status)"></span></div>
                <div class="agent-heat" x-show="kanbanModal.effective_assigned_agent_id">
                  <b>Карта активности:</b>
                  <template x-for="i in [1,2,3]" :key="i"><span class="heat-dot" :class="(i <= (kanbanModal.agent_activity_heat||0) ? 'on ' : '') + (kanbanModal.agent_activity_state||'stale')"></span></template>
                  <span x-text="(kanbanModal.agent_activity_state||'unknown') + (kanbanModal.agent_activity_age_minutes!=null ? ' · '+kanbanModal.agent_activity_age_minutes+' мин назад' : '')"></span>
                </div>
                <div class="ga-line"><b>Куратор:</b> <span class="link" @click="openAgent(kanbanModal.curator_agent_id)" x-text="kanbanModal.curator_agent_name||kanbanModal.curator_agent_id||'—'"></span></div>
                <div class="ga-line"><b>Следующий шаг:</b> <span x-text="kanbanModal.next_step||'—'"></span></div>
                <div class="ga-line"><b>Обсуждение:</b> <span class="link" @click="openTaskDiscussion(kanbanModal)" x-text="kanbanModal.agent_discussion_id||'—'"></span></div>
                <div class="ga-line"><b>Ответ владельца:</b> <span x-text="kanbanModal.requires_owner_action ? 'нужен' : 'не нужен'"></span></div>
                <div class="ga-line" x-show="kanbanModal.blocked_reason"><b>Блокировка:</b> <span x-text="kanbanModal.blocked_reason"></span></div>
                <div style="margin-top:6px"><template x-for="sk in kanbanModal.required_skills||[]" :key="sk"><span class="skill-chip" :class="(kanbanModal.missing_skills||[]).includes(sk)?'missing':'matched'" @click="openSkill(sk)" x-text="((kanbanModal.missing_skills||[]).includes(sk)?'⚠ ':'✓ ')+sk"></span></template></div>
                <div class="ga-line" x-show="(kanbanModal.missing_skills||[]).length" style="color:#e67e22"><b>Нехватка скилов:</b> <span x-text="(kanbanModal.missing_skills||[]).join(', ')"></span><div class="ga-actions"><button class="btn" @click="openAgentDirectChat('katya')">Катя: подобрать агента</button><button class="btn" @click="openAgentDirectChat('anton')">Антон: доработать скил</button></div></div>
              </div>
              <div class="kb-status-btns">
                <template x-for="col in kanbanColumns()" :key="col.id">
                  <button class="kb-layer-btn" @click="moveCard(kanbanModal.id,col.id)" x-text="col.label"></button>
                </template>
                <button class="kb-layer-btn" @click="deleteCard(kanbanModal.id)">Удалить</button>
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>

  </div>

  <div class="chat-sidebar" :class="{closed:!chatOpen}">
    <div class="chat-tabs">
      <template x-for="(sess, idx) in chatSessions" :key="sess.id">
        <div class="chat-tab" :class="{active:activeChatId===sess.id}" @click="switchChat(sess.id)">
          <span x-text="sess.name"></span>
          <span class="chat-tab-x" @click.stop="closeChat(idx)">✕</span>
        </div>
      </template>
      <div class="chat-tab" :class="{active:activeChatId==='__board__'}" @click="activeChatId='__board__';loadBoardMessages()">
        🏛 Агенты
      </div>
      <button class="chat-add" @click="newChat()" title="Новый чат">+</button>
    </div>

    <div class="chat-messages" x-ref="msgArea">
      <template x-if="!activeChatId">
        <div class="chat-empty">Открой чат (+) для общения с Hermes</div>
      </template>
      <template x-if="activeChatId==='__board__'">
        <div>
          <div style="font-size:11px;color:#aaa;text-align:center;padding:.5rem 0 .75rem">Поток событий агентов · обновляется при отправке</div>
          <template x-if="boardMessages.length===0">
            <div class="chat-empty">Агенты ещё не передавали сообщений</div>
          </template>
          <template x-for="msg in boardMessages" :key="msg.id">
            <div class="board-msg" :class="msg.stream">
              <span class="board-time" x-text="msg.time"></span>
              <span class="board-agent" x-text="(msg.data?.agent||msg.data?.source||'?').toUpperCase()"></span>
              <div class="board-content" x-text="msg.data?.message||msg.data?.content||JSON.stringify(msg.data)"></div>
            </div>
          </template>
        </div>
      </template>
      <template x-if="activeChatId && activeChatId!=='__board__' && (!chatMessages[activeChatId] || chatMessages[activeChatId].length===0)">
        <div class="chat-empty">Начни диалог ↓</div>
      </template>
      <template x-for="msg in (chatMessages[activeChatId]||[])" :key="msg.id">
        <div class="msg" :class="msg.role">
          <div class="msg-bubble" x-text="msg.content"></div>
          <div class="msg-time" x-text="fmtTime(msg.created_at)"></div>
        </div>
      </template>
      <template x-if="chatLoading">
        <div class="typing"><span></span><span></span><span></span></div>
      </template>
    </div>

      <template x-if="activeChatId==='__board__'">
        <div class="chat-input-area">
          <select class="target-select" x-model="boardTarget">
            <option value="corp">→ Все агенты</option>
            <option value="p01">→ P01 Бизнес-трекер</option>
            <option value="p02">→ P02 Аудит-агент</option>
            <option value="a01">→ A01 Контроллер</option>
          </select>
          <div class="chat-input-row">
            <textarea class="chat-textarea" x-model="boardInput" placeholder="Задача для агентов..."
                      @keydown.enter.prevent="if(!$event.shiftKey) sendBoardMsg()" rows="1" @input="autoResize($event)"></textarea>
            <button class="chat-send" @click="sendBoardMsg()" :disabled="!boardInput.trim()||boardLoading">↑</button>
          </div>
        </div>
      </template>
      <template x-if="activeChatId && activeChatId!=='__board__'">
    <div class="chat-input-area">
      <div class="chat-input-row">
        <label class="chat-file-btn" title="Прикрепить файл">
          📎<input type="file" style="display:none" @change="attachFile($event)">
        </label>
        <textarea class="chat-textarea" x-model="chatInput" placeholder="Сообщение Hermes..."
                  @keydown.enter.prevent="if(!$event.shiftKey) sendMsg()"
                  rows="1" @input="autoResize($event)"></textarea>
        <button class="chat-send" @click="sendMsg()" :disabled="!chatInput.trim()||chatLoading">↑</button>
      </div>
      <div style="font-size:10px;color:#ccc;margin-top:5px;text-align:center">Enter — отправить · Shift+Enter — перенос</div>
    </div>
      </template>
  </div>
</div>
<script>
function app() {
  return {
    view: 'dashboard', projects: [], sys: {cpu:0,ram_gb:0,ram_total:16,ram_pct:0,disk_pct:0,disk_free:''},
    detail: null, alerts: [], totalCost: 0, loading: false,
    lastUpdateTs: null, staleMins: 0, timeAgoLabel: '—',
    settings: {}, agents: [], generalAgents: [], selectedAgent: null, skills: [], skillDetail: null,
    chatOpen: false, chatSessions: [], activeChatId: null,
    chatMessages: {}, chatInput: '', chatLoading: false,
    agentCounts: {}, workroomKind: 'chat', workroomContent: '',
    boardMessages: [], boardInput: '', boardTarget: 'corp', boardLoading: false, agentFilterStatus:'all', agentFilterType:'all', agentFilterProject:'all', agentFilterSkill:'', agentStalls:{items:[],count:0}, currentAgentChatId:'global-agents-chat', agentChatTitle:'Общий чат агентов', agentChatMessages:[], agentChatInput:'', agentChatTaskTitle:'', agentChatTaskAgent:'', agentChatTaskPriority:'P2',
    knowledge: {items: [], summary: {}}, knowledgeFilter: 'all',
    parallelWorkerStatus: {subtasks_by_status:{}, recent_events:[], pending_owner_decisions:[], latest_worker_metrics:null, safe_default_mode:'dry_run', cli_enabled_env:false},
    kanbanCards: [], kanbanLayer: 'strategic', kanbanFilter: 'all', kanbanProjectFilter: 'all', kanbanModal: null, draggedCardId: null, newCard: {title:'',description:'',card_type:'task',layer:'strategic',project_id:null,priority:'P2'},
    sections: [
      {type:'business', label:'Бизнес', icon:'💼'},
      {type:'software_product', label:'Продукты', icon:'🧩'},
      {type:'internal_tool', label:'Внутренние инструменты', icon:'🛠'},
      {type:'personal', label:'Личные', icon:'👤'},
      {type:'admin', label:'Администрация', icon:'⚙️'},
      {type:'external', label:'Сторонние', icon:'🤝'}
    ],

    async init() {
      await this.load();
      setInterval(()=>this.load(), 30000);
      setInterval(()=>this.updateTimeAgo(), 15000);
      this.connectWS();
      await this.loadChatSessions();
      await this.loadAgentCounts();
      await this.loadBoardMessages();
      await this.loadGeneralAgents();
        await this.loadStalls();
      await this.loadParallelWorkerStatus();
    },

    async load() {
this.loading = true;
      try {
        const [sysR, projR, costR] = await Promise.all([
          fetch('/api/system').then(r=>r.json()),
          fetch('/api/projects').then(r=>r.json()),
          fetch('/api/costs/today').then(r=>r.json())
        ]);
        this.sys = sysR;
        this.projects = projR;
        this.totalCost = costR.total||0;
        this.lastUpdateTs = new Date();
        this.updateTimeAgo();
        this.alerts = projR.filter(p=>p.status==='error').map(p=>p.id.toUpperCase()+': проблема с агентом');
        await this.loadGeneralAgents();
        await this.loadParallelWorkerStatus();
        if(this.detail) await this.loadDetail(this.detail.id);
      } catch(e) { this.alerts = ['ошибка загрузки']; }
      this.loading = false;
    },

    updateTimeAgo() {
      if(!this.lastUpdateTs) return;
      const mins = Math.floor((new Date()-this.lastUpdateTs)/60000);
      this.staleMins = mins;
      this.timeAgoLabel = mins===0 ? 'только что' : `обновлено ${mins} мин назад`;
    },

    async loadDetail(id) {
      const d = await fetch('/api/projects/'+id).then(r=>r.json());
      this.detail = d; this.view = 'dashboard';
      await this.loadWorkroom(id, this.workroomKind || 'chat');
    },

    async loadWorkroom(id, kind='chat') {
      this.workroomKind = kind;
      try {
        const r = await fetch('/api/project-companies/'+id+'/workroom?kind='+encodeURIComponent(kind)).then(x=>x.json());
        this.workroomContent = r.content || '';
      } catch(e) {
        this.workroomContent = 'ошибка загрузки workroom';
      }
    },

    async pauseProj(id) {
      await fetch('/api/projects/'+id+'/pause',{method:'POST'});
      await this.load(); if(this.detail&&this.detail.id===id) await this.loadDetail(id);
    },

    async startProj(id) {
      await fetch('/api/projects/'+id+'/start',{method:'POST'});
      await this.load(); if(this.detail&&this.detail.id===id) await this.loadDetail(id);
    },

    byType(t) { return this.projects.filter(p=>p.type===t); },
    countActive(t) { return this.projects.filter(p=>p.type===t&&p.status==='active').length; },

    dotCls(s) { return {active:'dg',paused:'dp',error:'dr'}[s]||'dn'; },
    badgeCls(s) { return {active:'b-ok',paused:'b-pause',error:'b-err'}[s]||'b-new'; },
    statusLabel(s) { return {active:'активен',paused:'на паузе',error:'ошибка',archived:'архив',new:'не запущен'}[s]||s; },

    relTime(iso) {
      if(!iso) return '—';
      const mins = Math.floor((new Date()-new Date(iso))/60000);
      if(mins<1) return 'только что';
      if(mins<60) return mins+' мин назад';
      const hrs = Math.floor(mins/60);
      return hrs<24 ? hrs+' ч назад' : Math.floor(hrs/24)+' дн назад';
    },

    async loadParallelWorkerStatus() {
      this.parallelWorkerStatus = await fetch('/api/parallel/worker/status').then(r=>r.json()).catch(()=>this.parallelWorkerStatus);
    },
    parallelStatusCount(status) { return this.parallelWorkerStatus?.subtasks_by_status?.[status] || 0; },
    parallelWorkerSummary() {
      const m = this.parallelWorkerStatus?.latest_worker_metrics;
      if(!m) return 'ещё нет worker_tick_summary';
      return `${m.mode || 'dry_run'} · done ${m.executed_count||0} · skipped ${m.skipped_count||0} · failed ${m.failed_count||0} · ${m.duration_seconds||0}s`;
    },

    async loadSettings() {
      this.settings = await fetch('/api/settings').then(r=>r.json());
    },


    async loadKanban() {
      this.kanbanCards = await fetch('/api/kanban?layer=' + this.kanbanLayer).then(r => r.json());
    },
    kanbanColumns() {
      return this.kanbanLayer === 'strategic'
        ? [{id:'idea',label:'💡 Идеи'},{id:'planned',label:'📋 Запланировано'},{id:'in_progress',label:'⚙️ В работе'},{id:'done',label:'✅ Запущен'},{id:'frozen',label:'❄️ Заморожено'}]
        : [{id:'queue',label:'📥 Очередь'},{id:'in_progress',label:'⚙️ В работе'},{id:'review',label:'🔍 Проверка'},{id:'done',label:'✅ Готово'},{id:'blocked',label:'🚫 Заблокировано'}];
    },
    cardsForColumn(colId) {
      let cards = this.kanbanCards.filter(c => c.status === colId);
      if (this.kanbanFilter !== 'all') cards = cards.filter(c => c.card_type === this.kanbanFilter);
      if (this.kanbanProjectFilter !== 'all') cards = cards.filter(c => c.project_id === this.kanbanProjectFilter);
      return cards.sort((a,b) => (a.priority||'P2').localeCompare(b.priority||'P2'));
    },
    colCount(colId) { return this.cardsForColumn(colId).length; },
    priorityClass(p) { return {'P0':'kb-p0','P1':'kb-p1','P2':'kb-p2','P3':'kb-p3'}[p] || 'kb-p3'; },
    timeClass(hrs) { return hrs > 72 ? 'danger' : hrs > 24 ? 'warn' : ''; },
    cardTypeClass(t) { return {'tech_debt':'td','bug':'bug','feature':'feature'}[t] || ''; },
    openCard(card) { this.kanbanModal = card; },

    kbDragStart(cardId, e) { this.draggedCardId = cardId; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', cardId); } catch(_) {} },
    kbDragEnd() { this.draggedCardId = null; document.querySelectorAll('.kb-drop-target').forEach(el => el.classList.remove('kb-drop-target')); },
    kbDragOver(colId, e) { e.currentTarget.classList.add('kb-drop-target'); },
    kbDragLeave(e) { e.currentTarget.classList.remove('kb-drop-target'); },
    async kbDrop(colId, e) { e.currentTarget.classList.remove('kb-drop-target'); const id = this.draggedCardId || e.dataTransfer.getData('text/plain'); if (id) await this.moveCard(id, colId); this.kbDragEnd(); },
    async moveCard(cardId, newStatus) { await fetch('/api/kanban/' + cardId + '/status', {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status:newStatus})}); await this.loadKanban(); this.kanbanModal = null; },
    async createCard() { if (!this.newCard.title.trim()) return; this.newCard.layer = this.kanbanLayer; await fetch('/api/kanban', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(this.newCard)}); this.newCard = {title:'',description:'',card_type:'task',layer:'strategic',project_id:null,priority:'P2'}; await this.loadKanban(); },
    async deleteCard(id) { if (!confirm('Удалить карточку?')) return; await fetch('/api/kanban/' + id, {method:'DELETE'}); this.kanbanModal = null; await this.loadKanban(); },
    async loadKnowledge() {
      this.knowledge = await fetch('/api/knowledge').then(r=>r.json());
    },

    async loadAgents() {
      this.agents = await fetch('/api/agents').then(r=>r.json()).catch(()=>[]);
    },

    async loadStalls() {
      this.agentStalls = await fetch('/api/agents/stalls').then(r=>r.json()).catch(()=>({items:[],count:0}));
    },

    async loadSkills() {
      this.skills = await fetch('/api/skills').then(r=>r.json()).catch(()=>[]);
    },

    async openSkill(name) {
      if(!name) return;
      this.skillDetail = await fetch('/api/skills/'+encodeURIComponent(name)).then(r=>r.json());
      this.view = 'skill';
    },

    skillNameFromKnowledge(item) {
      if(!item) return '';
      const n = (item.name || item.id || '').toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-|-$/g,'');
      const found = this.skills.find(s => s.name === item.name || s.name === item.id || s.name === n || s.id === n);
      return found ? found.name : (item.category === 'skill' ? n : '');
    },

    agentSkills(agent) {
      const hay = ((agent.id||'')+' '+(agent.name||'')+' '+(agent.role||'')).toLowerCase();
      const names = [];
      if(hay.includes('cost') || hay.includes('controller') || hay.includes('a01')) names.push('cost-reporter');
      if(hay.includes('research') || hay.includes('a06')) names.push('llm-wiki');
      if(hay.includes('dispatcher') || hay.includes('hermes') || hay.includes('a04')) names.push('master-router');
      if(hay.includes('git')) names.push('git-manager');
      if(hay.includes('dashboard') || hay.includes('a08')) names.push('system-status');
      if(hay.includes('quality') || hay.includes('audit')) names.push('requesting-code-review');
      if(hay.includes('risk')) names.push('systematic-debugging');
      return [...new Set(names)].filter(n => this.skills.length===0 || this.skills.some(s => s.name === n));
    },

    async refreshKnowledge() {
      await fetch('/api/knowledge/refresh', {method:'POST'});
      setTimeout(()=>this.loadKnowledge(), 3000);
    },

    filteredKnowledge() {
      if (this.knowledgeFilter === 'all') return this.knowledge.items || [];
      return (this.knowledge.items || []).filter(i => i.category === this.knowledgeFilter || i.status === this.knowledgeFilter);
    },

    knowledgeColor(score) {
      if (score >= 80) return '#27ae60';
      if (score >= 50) return '#e67e22';
      return '#e74c3c';
    },

    knowledgeIcon(status) {
      return {ok:'🟢', outdated:'🟡', critical:'🔴', unknown:'❓'}[status] || '❓';
    },

    async updateSetting(key, value) {
      await fetch('/api/settings/'+encodeURIComponent(key),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value})});
    },

    groupLabel(g) {
      return {
        budget:'Бюджеты проектов', cron:'Расписание (cron)', system:'Система', general:'Общие',
        rules:'Правила уровня 0', notifications:'Уведомления и доставка', agents:'Генеральные агенты',
        kanban:'Канбан и задачи', hermes:'Hermes Agent', safety:'Безопасность'
      }[g]||g;
    },

    groupDescription(g) {
      return {
        budget:'Старые настройки бюджетов и лимитов расходов.',
        cron:'Плановые задачи: daily-cost-report, model picker, git auto-commit.',
        system:'Служебные параметры dashboard/gateway без секретов.',
        rules:'Генеральные правила CEO-режима: владелец не оператор, минимум экранного времени.',
        notifications:'Telegram и delivery guard; учитывает известную проблему daily-cost-report target resolved failed.',
        agents:'Политика Пепе, Антона и Кати на верхнем уровне управления.',
        kanban:'Связи агент → задача → скилы → чат → журнал.',
        hermes:'Модель, профили, делегирование, память, skills, MCP и webhooks.',
        safety:'Ограничения на .env, секреты, БД, продакшен и удаление данных.'
      }[g] || '';
    },

    settingsGroupOrder() {
      const preferred = ['general','rules','agents','kanban','notifications','budget','cron','hermes','system','safety'];
      return [...preferred.filter(g => this.settings[g]), ...Object.keys(this.settings).filter(g => !preferred.includes(g))];
    },

    isSecretSetting(key) {
      const k = (key || '').toLowerCase();
      return k.includes('secret') || k.includes('token') || k.includes('api_key') || k.endsWith('_key');
    },

    isLongSetting(item) {
      const k = (item?.key || '').toLowerCase();
      const v = item?.value || '';
      return k.includes('rules') || k.includes('policy') || k.includes('mandate') || k.includes('guardrails') || k.includes('routing') || v.length > 90 || v.includes('\n');
    },

    connectWS() {
      const ws = new WebSocket('ws://'+location.host+'/ws');
      ws.onmessage = e => {
        const d = JSON.parse(e.data);
        if(d.type==='system') this.sys = d.data;
        if(d.type==='project_update') {
          const p = this.projects.find(x=>x.id===d.id);
          if(p) p.status = d.status;
        }
        if(d.type==='chat' && d.session_id===this.activeChatId) {
          if(!this.chatMessages[d.session_id]) this.chatMessages[d.session_id]=[];
          this.chatMessages[d.session_id].push({id:Date.now(),role:d.role,content:d.content,created_at:new Date().toISOString()});
          this.chatLoading = false;
          this.$nextTick(()=>this.scrollChat());
        }
      };
      ws.onclose = () => setTimeout(()=>this.connectWS(), 5000);
    },

    async loadChatSessions() {
      this.chatSessions = await fetch('/api/chat/sessions').then(r=>r.json());
    },

    async newChat() {
      const name = 'Чат '+(this.chatSessions.length+1);
      const s = await fetch('/api/chat/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}).then(r=>r.json());
      this.chatSessions.unshift(s);
      await this.switchChat(s.id);
      this.chatOpen = true;
    },

    async switchChat(sid) {
      this.activeChatId = sid;
      if(!this.chatMessages[sid]) {
        const msgs = await fetch('/api/chat/sessions/'+sid+'/messages').then(r=>r.json());
        this.chatMessages[sid] = msgs;
      }
      this.$nextTick(()=>this.scrollChat());
    },

    async closeChat(idx) {
      const sid = this.chatSessions[idx]?.id;
      if(!sid) return;
      try {
        await fetch('/api/chat/sessions/'+sid,{method:'DELETE'});
      } catch(e) {}
      this.chatSessions.splice(idx,1);
      delete this.chatMessages[sid];
      if(this.activeChatId===sid) this.activeChatId = this.chatSessions[0]?.id||null;
    },

    async sendMsg() {
      const content = this.chatInput.trim();
      if(!content || !this.activeChatId || this.chatLoading) return;
      const sid = this.activeChatId;
      if(!this.chatMessages[sid]) this.chatMessages[sid]=[];
      this.chatMessages[sid].push({id:Date.now(),role:'user',content,created_at:new Date().toISOString()});
      this.chatInput = '';
      this.chatLoading = true;
      this.$nextTick(()=>this.scrollChat());
      try {
        await fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,content})});
      } catch(e) {
        this.chatMessages[sid].push({id:Date.now()+1,role:'assistant',content:'Ошибка соединения',created_at:new Date().toISOString()});
      } finally {
        this.chatLoading=false;
      }
    },

    async attachFile(e) {
      const file = e.target.files[0];
      if(!file||!this.activeChatId) return;
      if(!this.chatMessages[this.activeChatId]) this.chatMessages[this.activeChatId]=[];
      const fd = new FormData(); fd.append('file',file);
      const r = await fetch('/api/chat/upload',{method:'POST',body:fd}).then(x=>x.json());
      this.chatInput = (this.chatInput+' [файл: '+r.name+' → '+r.path+']').trim();
    },

    async openChatWith(prefix) {
      this.chatOpen = true;
      if(!this.activeChatId) { await this.newChat(); }
      this.chatInput = prefix;
      this.$nextTick(()=>document.querySelector('.chat-textarea')?.focus());
    },

    scrollChat() {
      const el = this.$refs.msgArea;
      if(el) el.scrollTop = el.scrollHeight;
    },

    autoResize(e) {
      e.target.style.height='auto';
      e.target.style.height=Math.min(e.target.scrollHeight,100)+'px';
    },


    async loadAgentCounts() {
      this.agentCounts = await fetch('/api/agents/counts').then(r=>r.json());
    },
    async loadBoardMessages() {
      this.boardMessages = await fetch('/api/board/messages').then(r=>r.json());
    },
    async sendBoardMsg() {
      if(!this.boardInput.trim()) return;
      this.boardLoading = true;
      await fetch('/api/board/send',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({content:this.boardInput,target:this.boardTarget})});
      this.boardInput = '';
      await this.loadBoardMessages();
      this.boardLoading = false;
    },
    agentDotsFor(pid) {
      const c = this.agentCounts[pid];
      if(!c) return [];
      return Array.from({length:c.total},(_,i)=>i<c.active?'ok':'idle');
    },

    async loadGeneralAgents() {
      this.generalAgents = await fetch('/api/agents/general').then(r=>r.json()).catch(()=>[]);
    },
    filteredAgents() {
      let a = this.agents || [];
      if(this.agentFilterStatus !== 'all') a = a.filter(x => x.status === this.agentFilterStatus);
      if(this.agentFilterType !== 'all') a = a.filter(x => x.type === this.agentFilterType);
      if(this.agentFilterProject !== 'all') a = a.filter(x => (x.current_task_project_id===this.agentFilterProject) || (x.current_project_id===this.agentFilterProject) || (x.project_id===this.agentFilterProject) || (this.agentFilterProject==='corp' && !x.current_task_project_id && !x.current_project_id && !x.project_id));
      if(this.agentFilterSkill.trim()) a = a.filter(x => (x.skills||[]).some(sk => sk.toLowerCase().includes(this.agentFilterSkill.trim().toLowerCase())));
      return a;
    },
    agentIcon(id) { return {pepe:'🐸',anton:'🛠',katya:'👥'}[id] || '🤖'; },
    agentStatusLabel(s) { return {active:'Активен',thinking:'Думает',waiting:'Ждёт',idle:'Свободен',error:'Ошибка',paused:'Пауза'}[s] || s || '—'; },
    agentStatusClass(s) { return 'status-' + (s || 'idle'); },
    workDuration(a) { const iso=a?.active_since||a?.current_task_started_at; if(!iso) return '—'; const mins=Math.floor((new Date()-new Date(iso))/60000); if(mins<60) return mins+' мин'; return Math.floor(mins/60)+' ч '+(mins%60)+' мин'; },
    async openAgent(id) { this.selectedAgent = await fetch('/api/agents/'+encodeURIComponent(id)).then(r=>r.json()); this.view='agentDetail'; },
    openAgentChatPage() { this.currentAgentChatId='global-agents-chat'; this.agentChatTitle='Общий чат агентов'; this.view='agentChat'; this.loadAgentChatMessages(this.currentAgentChatId); },
    openTaskDiscussion(card) { if(!card || !card.agent_discussion_id) return; this.currentAgentChatId=card.agent_discussion_id; this.agentChatTitle='Обсуждение задачи: '+(card.title||card.id); this.view='agentChat'; this.loadAgentChatMessages(this.currentAgentChatId); },
    async openAgentDirectChat(id) { this.currentAgentChatId='chat-agent-'+id; this.agentChatTitle='Личный чат: '+id; this.view='agentChat'; await this.loadAgentChatMessages(this.currentAgentChatId); },
    async loadAgentChatMessages(chatId) { this.agentChatMessages = await fetch('/api/agent-chats/'+encodeURIComponent(chatId)+'/messages').then(r=>r.json()).catch(()=>[]); },
    async sendAgentChatMessage() { if(!this.agentChatInput.trim()) return; await fetch('/api/agent-chats/'+encodeURIComponent(this.currentAgentChatId)+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:this.agentChatInput})}); this.agentChatInput=''; await this.loadAgentChatMessages(this.currentAgentChatId); },
    async createTaskFromAgentChat(message=null) {
      const title = (this.agentChatTaskTitle || '').trim() || (message?.text ? message.text.slice(0,90) : '') || this.agentChatInput.trim() || prompt('Название задачи');
      if(!title) return;
      const payload = {
        title,
        description: message?.text || this.agentChatInput || 'Создано из чата агентов',
        message_id: message?.id || null,
        agent_id: this.agentChatTaskAgent || null,
        priority: this.agentChatTaskPriority || 'P2',
        project_id: message?.project_id || 'corp'
      };
      const res = await fetch('/api/agent-chats/'+encodeURIComponent(this.currentAgentChatId)+'/create-task',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json());
      this.agentChatTaskTitle='';
      await this.loadAgentChatMessages(this.currentAgentChatId); await this.loadKanban(); await this.loadGeneralAgents();
      if(res?.id) await this.openKanbanTask(res.id);
    },
    async openKanbanTask(id) { if(!id) return; this.view='kanban'; await this.loadKanban(); const card=this.kanbanCards.find(c=>c.id===id); if(card) this.kanbanModal=card; },
    fmtTime(iso) {
      if(!iso) return '';
      const d = new Date(iso);
      return d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
    }
  }
}
window.app = app;
</script>
</body>
</html>
